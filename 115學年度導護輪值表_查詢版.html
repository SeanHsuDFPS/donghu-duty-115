<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>115學年度 導護老師輪值表｜臺北市內湖區東湖國民小學</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#17212B; --ink2:#3D4C57; --slate:#6B7C84; --faint:#93A1A6;
  --paper:#EDEFEA; --card:#FBFCF9; --rule:#D6DCD5;
  --deep:#2E4A52; --deep-soft:#DCE6E5;
  --brass:#A9761F; --brass-soft:#F0E3C6;
  --seal:#9C3B2E; --seal-soft:#FBF1EE;
  --serif:"Noto Serif TC","標楷體",serif;
  --sans:"Noto Sans TC","微軟正黑體",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
  --r:3px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);
  font-size:15px;line-height:1.65;-webkit-text-size-adjust:100%}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}

header{padding:44px 0 26px;border-bottom:1px solid var(--rule)}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.22em;color:var(--slate);margin:0 0 10px}
h1{font-family:var(--serif);font-weight:900;font-size:clamp(28px,5vw,44px);
  letter-spacing:.04em;margin:0;line-height:1.2}
h1 .yr{color:var(--brass)}
.sub{color:var(--ink2);margin:12px 0 0;max-width:58ch;font-size:14.5px}

/* search */
.searchbar{position:sticky;top:0;z-index:40;background:var(--paper);
  border-bottom:1px solid var(--rule);padding:13px 0 10px;
  box-shadow:0 6px 18px -18px rgba(23,33,43,.8)}
.searchbox{position:relative;display:flex;gap:10px}
.searchbox>svg{position:absolute;left:14px;top:24px;transform:translateY(-50%);
  width:18px;height:18px;color:var(--slate);pointer-events:none}
#q{flex:1;font-family:var(--sans);font-size:16px;padding:13px 14px 13px 42px;
  border:1.5px solid var(--rule);border-radius:var(--r);background:var(--card);
  color:var(--ink);outline:none;transition:border-color .15s,box-shadow .15s;min-width:0}
#q:focus{border-color:var(--deep);box-shadow:0 0 0 3px var(--deep-soft)}
#q::placeholder{color:var(--faint)}
.btn{font-family:var(--sans);font-size:15px;font-weight:500;padding:0 22px;
  border:1.5px solid var(--deep);background:var(--deep);color:#fff;border-radius:var(--r);
  cursor:pointer;white-space:nowrap;transition:background .15s}
.btn:hover{background:#24393F}
.btn:focus-visible,#q:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.hint{font-size:12px;color:var(--slate);margin:7px 0 0;display:flex;flex-wrap:wrap;gap:4px 14px}
.hint b{font-weight:500;color:var(--ink2)}
.hint code{font-family:var(--mono);font-size:11.5px;background:var(--card);
  border:1px solid var(--rule);border-radius:2px;padding:1px 5px}
#sug{position:absolute;top:52px;left:0;right:0;background:var(--card);
  border:1px solid var(--rule);border-radius:var(--r);max-height:340px;overflow:auto;
  display:none;box-shadow:0 12px 30px -12px rgba(23,33,43,.35);z-index:5}
#sug.on{display:block}
#sug button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  background:none;border:0;border-bottom:1px solid var(--rule);padding:9px 14px;
  font-family:var(--sans);font-size:15px;color:var(--ink);cursor:pointer}
#sug button:last-child{border-bottom:0}
#sug button:hover,#sug button.sel{background:var(--deep-soft)}
#sug .kind{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;padding:2px 6px;
  border-radius:2px;background:var(--deep-soft);color:var(--deep);flex:none}
#sug .k-date .kind,#sug .k-week .kind{background:var(--brass-soft);color:var(--brass)}
#sug .meta{margin-left:auto;font-size:12.5px;color:var(--slate);font-family:var(--mono)}

/* roster */
.sem{padding:38px 0 8px}
.semhead{display:flex;align-items:baseline;gap:16px;margin:0 0 20px;
  padding-bottom:10px;border-bottom:2px solid var(--ink)}
.semhead h2{font-family:var(--serif);font-weight:700;font-size:24px;margin:0;letter-spacing:.08em}
.semhead .meta{font-family:var(--mono);font-size:12.5px;color:var(--slate)}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(268px,1fr))}
.wk{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);overflow:hidden}
.wk-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;
  padding:0;background:#F2F4EF;border-bottom:1px solid var(--rule)}
.wk-h button{flex:1;display:flex;align-items:baseline;justify-content:space-between;gap:8px;
  background:none;border:0;padding:9px 12px;cursor:pointer;font-family:inherit;color:inherit}
.wk-h button:hover{background:var(--deep-soft)}
.wk-n{font-family:var(--serif);font-weight:700;font-size:15px;letter-spacing:.06em}
.wk-d{font-family:var(--mono);font-size:12.5px;color:var(--ink2)}
.wk-note{padding:5px 12px;font-size:12px;color:var(--seal);background:var(--seal-soft);
  border-bottom:1px solid var(--rule);font-family:var(--mono)}
.rows{list-style:none;margin:0;padding:4px 0}
.rows li{display:flex;align-items:center;gap:10px;padding:1px 12px}
.pn{font-family:var(--mono);font-size:11.5px;font-weight:600;width:22px;height:22px;flex:none;
  display:grid;place-items:center;border-radius:2px;background:var(--deep-soft);color:var(--deep)}
.rows li.g7 .pn{background:var(--brass-soft);color:var(--brass)}
.nm{font-family:var(--sans);font-size:14.5px;background:none;border:0;padding:3px 4px;
  color:var(--ink);cursor:pointer;border-radius:2px;text-align:left;flex:1}
.nm:hover{background:var(--deep-soft)}
.nm:focus-visible,.wk-h button:focus-visible{outline:2px solid var(--brass);outline-offset:1px}
.rows li.g7 .nm{font-weight:700}

footer{margin-top:46px;border-top:1px solid var(--rule);padding:28px 0 60px}
.fgrid{display:grid;gap:26px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.fbox h3{font-family:var(--serif);font-size:15px;font-weight:700;margin:0 0 8px;letter-spacing:.06em}
.fbox p{font-size:13.5px;color:var(--ink2);margin:0}
.fbox ol{padding-left:20px;font-family:var(--mono);font-size:12.5px;columns:2;column-gap:18px;margin:0}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12.5px;padding:3px 9px;border:1px solid var(--rule);border-radius:20px;
  background:var(--card);color:var(--ink2)}
.credit{margin-top:26px;font-family:var(--mono);font-size:11.5px;color:var(--faint)}
.byline{margin:14px 0 0;padding-top:14px;border-top:1px solid var(--rule);
  font-family:var(--serif);font-weight:500;font-size:13.5px;color:var(--ink2);letter-spacing:.08em}

/* modal */
.ov{position:fixed;inset:0;background:rgba(23,33,43,.55);backdrop-filter:blur(3px);
  display:none;z-index:60;padding:20px;overflow:auto}
.ov.on{display:block}
.modal{max-width:760px;margin:36px auto;background:var(--paper);border-radius:var(--r);
  box-shadow:0 30px 70px -20px rgba(23,33,43,.6);overflow:hidden;
  animation:rise .22s cubic-bezier(.2,.7,.3,1)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.modal{animation:none}}
.m-h{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;
  padding:22px 26px;background:var(--ink);color:#fff}
.m-h h2{font-family:var(--serif);font-size:26px;font-weight:700;margin:0;letter-spacing:.06em}
.m-h .role{font-family:var(--mono);font-size:12.5px;color:#B9C6CA;margin-top:5px}
.x{background:none;border:1px solid #4A5A64;color:#C8D3D6;width:32px;height:32px;flex:none;
  border-radius:var(--r);cursor:pointer;font-size:17px;line-height:1}
.x:hover{background:#2A3742;color:#fff}
.m-b{padding:22px 26px 28px}
.tally{font-family:var(--mono);font-size:12.5px;color:var(--slate);letter-spacing:.06em;margin:0 0 16px}

.duty{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);
  padding:18px 20px;margin-bottom:14px}
.duty.gate{border-color:var(--brass);background:#FDFAF2}
.d-top{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px;margin-bottom:12px}
.d-when{font-family:var(--serif);font-weight:700;font-size:18px;letter-spacing:.05em}
.d-date{font-family:var(--mono);font-size:13px;color:var(--ink2)}
.d-note{font-family:var(--mono);font-size:12px;color:var(--seal)}
.d-post{display:flex;flex-wrap:wrap;align-items:center;gap:14px;padding:12px 0;
  border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.badge{font-family:var(--serif);font-weight:900;font-size:22px;letter-spacing:.06em;
  padding:5px 14px;border-radius:2px;background:var(--deep);color:#fff;white-space:nowrap}
.duty.gate .badge{background:var(--brass)}
.d-area{font-size:15px;font-weight:500}
.d-box{font-size:12.5px;color:var(--slate);margin-top:5px;line-height:1.55}
svg.elev{display:block;margin:14px 0 4px;width:100%;max-width:400px;height:auto}
.mates{margin-top:12px}
.mates .lbl,.pl-lbl{font-family:var(--mono);font-size:11.5px;letter-spacing:.14em;
  color:var(--slate);margin-bottom:7px}
.mates ul{list-style:none;margin:0;padding:0;display:grid;gap:4px;
  grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.mates li{display:flex;align-items:center;gap:8px;font-size:14px}
.mates .pn{width:20px;height:20px;font-size:11px}
.mates button{background:none;border:0;padding:2px 4px;font-family:var(--sans);font-size:14px;
  color:var(--ink);cursor:pointer;border-radius:2px}
.mates button:hover{background:var(--deep-soft)}

/* week view */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 16px}
.chip{font-family:var(--mono);font-size:12px;padding:3px 9px;border:1px solid var(--rule);
  border-radius:2px;background:var(--card);color:var(--ink2)}
.chip.off{border-color:#E7CFC9;background:var(--seal-soft);color:var(--seal)}
.chip.on{border-color:var(--deep);background:var(--deep);color:#fff}
.postlist{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.postlist li{display:flex;gap:12px;align-items:flex-start;background:var(--card);
  border:1px solid var(--rule);border-radius:var(--r);padding:10px 14px}
.postlist li.g7{border-color:var(--brass);background:#FDFAF2}
.badge-sm{font-family:var(--serif);font-weight:700;font-size:14px;padding:4px 10px;border-radius:2px;
  background:var(--deep);color:#fff;white-space:nowrap;flex:none;min-width:62px;text-align:center}
.postlist li.g7 .badge-sm{background:var(--brass)}
.pl-name{font-size:16px;font-weight:500;background:none;border:0;padding:0;cursor:pointer;
  font-family:var(--sans);color:var(--ink);border-radius:2px}
.pl-name:hover{background:var(--deep-soft)}
.pl-area{font-size:12.5px;color:var(--slate);line-height:1.5}

.notice{background:var(--card);border:1px solid var(--rule);border-left:3px solid var(--brass);
  border-radius:var(--r);padding:16px 18px;margin-bottom:18px}
.notice h4{font-family:var(--serif);font-size:17px;margin:0 0 6px;font-weight:700;letter-spacing:.04em}
.notice p{margin:0;font-size:14px;color:var(--ink2)}
.jump{display:flex;flex-wrap:wrap;gap:8px;margin-top:13px}
.jump button{font-family:var(--sans);font-size:13.5px;padding:7px 14px;border:1px solid var(--deep);
  background:var(--card);color:var(--deep);border-radius:var(--r);cursor:pointer}
.jump button:hover{background:var(--deep);color:#fff}
.empty{background:var(--card);border:1px solid var(--rule);border-left:3px solid var(--brass);
  border-radius:var(--r);padding:18px 20px}
.empty p{margin:0 0 6px;font-size:14.5px}
.empty p:last-child{margin:0;color:var(--slate);font-size:13.5px}

@media(max-width:560px){
  .m-h,.m-b{padding-left:18px;padding-right:18px}
  .modal{margin:12px auto}
  .fbox ol{columns:1}
  .btn{padding:0 15px}
}
@media print{.searchbar,.credit{display:none}body{background:#fff}
  .grid{grid-template-columns:repeat(3,1fr)}.wk{break-inside:avoid}}
</style>
</head>

    <rect x="312" y="98" width="9" height="34" fill="${gt ? br : off}"/>
    <rect x="371" y="98" width="9" height="34" fill="${gt ? br : off}"/>
    <rect x="312" y="88" width="68" height="10" fill="${gt ? br : off}"/>
    <line x1="4" y1="132.5" x2="396" y2="132.5" stroke="${line}"/>
    <text x="93" y="148" font-size="10.5" fill="${txt}" text-anchor="middle" font-family="Noto Sans TC,sans-serif">忠孝樓・仁愛樓・信義樓</text>
    <text x="240" y="148" font-size="10.5" fill="${txt}" text-anchor="middle" font-family="Noto Sans TC,sans-serif">和平樓</text>
    <text x="346" y="148" font-size="10.5" fill="${txt}" text-anchor="middle" font-family="Noto Sans TC,sans-serif">東北門崗</text></svg>`;
}

/* ---------- 視窗 ---------- */
let lastFocus = null;
function show(title, sub, body) {
  $('#mtitle').textContent = title; $('#msub').textContent = sub; $('#mbody').innerHTML = body;
  $('#ov').classList.add('on'); document.body.style.overflow = 'hidden';
  $('#ov').scrollTop = 0; $('#mx').focus();
}
function close() {
  $('#ov').classList.remove('on'); document.body.style.overflow = '';
  if (lastFocus) lastFocus.focus();
}

function weekBody(si, wi) {
  const s = D.semesters[si], w = s.weeks[wi];
  const days = dutyOf(si, wi);
  const off = [];
  for (let d = parseISO(w.bs); iso(d) <= w.be; d.setDate(d.getDate() + 1)) {
    const k = iso(d);
    if (D.holidays[k]) off.push(`${md(k)} ${D.holidays[k]}`);
  }
  return `<p class="tally">值勤 ${days.length} 天${w.note ? ' · ' + w.note : ''}</p>
    <div class="chips">
      ${days.map(k => `<span class="chip on">${md(k)}</span>`).join('')}
      ${off.map(t => `<span class="chip off">${t}</span>`).join('')}
    </div>
    <div class="pl-lbl">本週導護老師</div>
    <ul class="postlist">${w.names.map((n, i) => {
      const p = POST[i + 1];
      return `<li class="${i === 6 ? 'g7' : ''}"><span class="badge-sm">${p.name}</span>
        <div><button class="pl-name" data-n="${n}">${n}</button>
        <div class="pl-area">${p.area}</div></div></li>`;
    }).join('')}</ul>`;
}

function openWeek(si, wi) {
  const s = D.semesters[si], w = s.weeks[wi];
  show(`${s.label}　第${w.cn}週`, w.period.replace('~', ' ~ '), weekBody(si, wi));
}

function openDate(k) {
  const info = dayInfo(k);
  const pv = prevDuty(k), nx = nextDuty(k);
  const jump = `<div class="jump">
    ${pv ? `<button data-d="${pv.d}">← 往前：${md(pv.d)}</button>` : ''}
    ${nx ? `<button data-d="${nx.d}">往後：${md(nx.d)} →</button>` : ''}</div>`;

  if (info.kind === 'duty') {
    const { si, wi } = info.wk, s = D.semesters[si], w = s.weeks[wi];
    show(fmt(k), `${s.label}　第${w.cn}週　值勤日`, weekBody(si, wi));
    return;
  }
  if (info.kind === 'break') {
    show(fmt(k), '非上課期間',
      `<div class="notice"><h4>這天不用站導護</h4>
        <p>${fmt(k)} 屬於${info.why}，不在導護輪值週次內。</p>${jump}</div>`);
    return;
  }
  const { si, wi } = info.wk, s = D.semesters[si], w = s.weeks[wi];
  const label = info.kind === 'weekend' ? `${info.why}（例假日）` : `放假日 — ${info.why}`;
  show(fmt(k), `${s.label}　第${w.cn}週　${info.kind === 'weekend' ? '例假日' : '放假日'}`,
    `<div class="notice"><h4>這天不用站導護</h4>
      <p>${fmt(k)} 是${label}。這一天屬於<strong>${s.label}第${w.cn}週</strong>，該週值勤日為 ${w.period}。</p>
      ${jump}</div>` + weekBody(si, wi));
}

function openTeacher(name) {
  const duties = IDX[name];
  if (duties) {
    const g7 = duties.filter(d => d.post === 7).length;
    const body = `<p class="tally">本學年共 ${duties.length} 次輪值${g7 ? ` · 含導護七 ${g7} 次` : ''}</p>` +
      duties.map(d => {
        const s = D.semesters[d.si], w = s.weeks[d.wi], p = POST[d.post];
        return `<div class="duty ${p.kind === 'gate' ? 'gate' : ''}">
          <div class="d-top"><span class="d-when">${s.label}　第${w.cn}週</span>
            <span class="d-date">${w.period}</span>
            ${w.note ? `<span class="d-note">${w.note}</span>` : ''}</div>
          <div class="d-post"><span class="badge">${p.name}</span>
            <div><div class="d-area">${p.area}</div><div class="d-box">${p.box}</div></div></div>
          ${elevation(p)}
          <div class="mates"><div class="lbl">同週輪值夥伴</div>
            <ul>${w.names.map((n, i) => i + 1 === d.post ? '' :
              `<li><span class="pn">${i + 1}</span><button data-n="${n}">${n}</button></li>`).join('')}</ul>
          </div></div>`;
      }).join('');
    show(name, D.roster[name] || '', body);
  } else if (D.exempt.includes(name)) {
    show(name, D.roster[name] || '', `<div class="empty"><p><strong>${name}</strong> 本學年免輪值導護。</p>
      <p>依說明3、4：年滿六十歲、懷孕或因重症等健康因素不宜輪值者，及專任輔導教師兼任導師，免除導護輪值。</p></div>`);
  } else if (D.excluded[name]) {
    show(name, D.roster[name] || '', `<div class="empty"><p><strong>${name}</strong> 不列入導護輪值。</p>
      <p>${D.excluded[name]}</p></div>`);
  } else {
    const near = ALL.filter(n => n.includes(name) || name.includes(n)).slice(0, 8);
    show(name, '查無資料', `<div class="empty"><p>名冊中查無「${name}」。</p>
      <p>${near.length ? '你要找的是不是：' + near.join('、') : '請確認姓名是否正確，或改用日期、週次查詢。'}</p></div>`);
  }
}

$('#mx').onclick = close;
$('#ov').onclick = e => { if (e.target === $('#ov')) close(); };
document.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
document.addEventListener('click', e => {
  const b = e.target.closest('[data-n],[data-w],[data-d]');
  if (!b) return;
  if (!e.target.closest('#sug')) lastFocus = b;
  if (b.dataset.n) openTeacher(b.dataset.n);
  else if (b.dataset.w) { const [si, wi] = b.dataset.w.split('.').map(Number); openWeek(si, wi); }
  else if (b.dataset.d) openDate(b.dataset.d);
});

/* ---------- 解析 ---------- */
function mk(y, m, d) {
  if (m < 1 || m > 12 || d < 1 || d > 31) return null;
  const dt = new Date(y, m - 1, d, 12);
  return (dt.getMonth() === m - 1 && dt.getDate() === d) ? iso(dt) : null;
}
const inferY = (m, d) => mk(m >= 8 ? 2026 : 2027, m, d);

function parseDate(v) {
  v = v.trim().replace(/[年月]/g, '/').replace(/日$/, '');
  let m;
  if (m = v.match(/^(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})$/)) return mk(+m[1], +m[2], +m[3]);
  if (m = v.match(/^(\d{4})(\d{2})(\d{2})$/)) return mk(+m[1], +m[2], +m[3]);
  if (m = v.match(/^(\d{1,2})[\/\-.](\d{1,2})$/)) return inferY(+m[1], +m[2]);
  if (m = v.match(/^(\d{3,4})$/)) return inferY(+m[1].slice(0, -2), +m[1].slice(-2));
  return null;
}
function parseWeek(v) {
  v = v.trim().replace(/\s/g, '');
  if (!/[上下第週wW]/.test(v)) return [];
  let sem = null, m = v.match(/^(上|下)(學期)?/);
  if (m) { sem = m[1] === '上' ? 0 : 1; v = v.slice(m[0].length); }
  v = v.replace(/^第/, '').replace(/週次?$/, '').replace(/^[wW]/, '');
  let no = /^\d+$/.test(v) ? +v : CNNO[v];
  if (!no || no < 1 || no > 21) return [];
  return sem === null ? [{ si: 0, wi: no - 1 }, { si: 1, wi: no - 1 }] : [{ si: sem, wi: no - 1 }];
}

/* ---------- 搜尋建議 ---------- */
const q = $('#q'), sug = $('#sug');
let sel = -1, list = [];
function build(v) {
  const out = [];
  const dk = parseDate(v);
  if (dk) {
    const info = dayInfo(dk);
    const meta = info.kind === 'duty'
      ? `${D.semesters[info.wk.si].label}第${D.semesters[info.wk.si].weeks[info.wk.wi].cn}週`
      : (info.kind === 'break' ? info.why : '放假日');
    out.push({ kind: 'date', k: '日期', label: fmt(dk), meta, act: () => openDate(dk) });
  }
  parseWeek(v).forEach(({ si, wi }) => {
    const s = D.semesters[si], w = s.weeks[wi];
    out.push({ kind: 'week', k: '週次', label: `${s.label}　第${w.cn}週`, meta: w.period,
               act: () => openWeek(si, wi) });
  });
  if (v) {
    ALL.filter(n => n.includes(v)).slice(0, 8).forEach(n =>
      out.push({ kind: 'teacher', k: '教師', label: n, meta: D.roster[n] || '', act: () => openTeacher(n) }));
    Object.keys(D.excluded).filter(n => n.includes(v)).slice(0, 4).forEach(n =>
      out.push({ kind: 'teacher', k: '教師', label: n, meta: D.roster[n] || '', act: () => openTeacher(n) }));
  }
  return out.slice(0, 12);
}
function render() {
  const v = q.value.trim();
  list = v ? build(v) : [];
  sel = -1;
  sug.innerHTML = list.map(o =>
    `<button class="k-${o.kind}"><span class="kind">${o.k}</span>${o.label}<span class="meta">${o.meta}</span></button>`).join('');
  sug.classList.toggle('on', list.length > 0);
}
q.addEventListener('input', render);
q.addEventListener('focus', render);
sug.addEventListener('mousedown', e => {
  const b = e.target.closest('button'); if (!b) return;
  e.preventDefault();
  sug.classList.remove('on'); lastFocus = q;
  list[[...sug.children].indexOf(b)].act();
});
q.addEventListener('keydown', e => {
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault(); if (!list.length) return;
    sel = (sel + (e.key === 'ArrowDown' ? 1 : -1) + list.length) % list.length;
    [...sug.children].forEach((c, i) => c.classList.toggle('sel', i === sel));
  } else if (e.key === 'Enter') { e.preventDefault(); submit(); }
  else if (e.key === 'Escape') sug.classList.remove('on');
});
function submit() {
  if (!list.length) render();
  sug.classList.remove('on'); lastFocus = q;
  if (list.length) (sel >= 0 ? list[sel] : list[0]).act();
  else if (q.value.trim()) openTeacher(q.value.trim());
}
$('#go').onclick = submit;
document.addEventListener('click', e => { if (!e.target.closest('.searchbox')) sug.classList.remove('on'); });
</script>
</body>
